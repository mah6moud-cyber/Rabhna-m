name: بناء ملف APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      - name: Find pubspec
        run: |
          PUBSPEC_DIR=$(find . -name "pubspec.yaml" | head -n 1 | xargs dirname)
          echo "PUBSPEC_DIR=$PUBSPEC_DIR" >> $GITHUB_ENV
          echo "Found in $PUBSPEC_DIR"
      - run: flutter pub get
        working-directory: ${{ env.PUBSPEC_DIR }}
      - run: flutter build apk --release
        working-directory: ${{ env.PUBSPEC_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.PUBSPEC_DIR }}/build/app/outputs/flutter-apk/app-release.apk
