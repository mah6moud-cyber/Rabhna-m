name: بناء ملف APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      - name: Find correct project
        run: |
          PUBSPEC_DIR=$(find . -type f -name "pubspec.yaml" -exec sh -c 'if [ -f "$(dirname {})/lib/main.dart" ]; then echo $(dirname {}); fi' \; | head -n 1)
          echo "PUBSPEC_DIR=$PUBSPEC_DIR" >> $GITHUB_ENV
          echo "Found project in: $PUBSPEC_DIR"
          ls -la $PUBSPEC_DIR
          ls -la $PUBSPEC_DIR/lib
      - run: flutter pub get
        working-directory: ${{ env.PUBSPEC_DIR }}
      - run: flutter build apk --release
        working-directory: ${{ env.PUBSPEC_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.PUBSPEC_DIR }}/build/app/outputs/flutter-apk/app-release.apk
